---
# Conversational Claude on issues and PRs, answering to "@claude".
#
# Unlike the read-only agents in internal-sense-stack and the siterm fork, this
# one can write: it branches, commits and opens a PR. That is deliberate and
# scoped to this repo, where a bad change is a reviewable Python diff rather
# than something that reaches a live cluster.
#
# Runs on NRP's Anthropic-compatible gateway, so the model is free and this
# public fork's Actions minutes are unmetered.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    # NRP is a shared, rate-limited gateway and can stall before the first
    # token. Cap the job so a stall fails visibly instead of hanging.
    timeout-minutes: 25
    permissions:
      # Write, so it can push a branch and open a PR. It must never push to
      # main; CLAUDE.md says so and main should carry a branch protection rule
      # as the enforcing control, since an allowlist entry for git push cannot
      # constrain the refspec.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.NRP_AUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: claude/
          # Attribute git operations to the repo owner rather than claude[bot],
          # so the history reads as theirs. Commit message conventions are in
          # CLAUDE.md.
          bot_name: groundsada
          bot_id: "65513692"

          claude_args: |
            --model glm-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh label list:*),mcp__github_inline_comment__create_inline_comment"

          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://ellm.nrp-nautilus.io/anthropic",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.NRP_AUTH_TOKEN }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "glm-5",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "glm-5",
                "CLAUDE_CODE_SUBAGENT_MODEL": "deepseek-v4-flash",
                "CLAUDE_CODE_AUTO_COMPACT_WINDOW": "200000",
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "16000",
                "API_TIMEOUT_MS": "600000",
                "CLAUDE_STREAM_IDLE_TIMEOUT_MS": "300000",
                "ENABLE_TOOL_SEARCH": "false",
                "DISABLE_TELEMETRY": "1",
                "DISABLE_NON_ESSENTIAL_MODEL_CALLS": "1",
                "CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1"
              }
            }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: https://ellm.nrp-nautilus.io/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.NRP_AUTH_TOKEN }}
          # NRP serves only its own model names on the Anthropic path. Without
          # these, subagent and background calls resolve to claude-* names and
          # 404 mid-run.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "200000"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "16000"
          API_TIMEOUT_MS: "600000"
          CLAUDE_STREAM_IDLE_TIMEOUT_MS: "300000"
          ENABLE_TOOL_SEARCH: "false"
          DISABLE_TELEMETRY: "1"
          DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
