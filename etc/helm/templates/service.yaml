apiVersion: v1
kind: Service
metadata:
  name: {{ include "dmm.fullname" . }}
  labels:
    {{- include "dmm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dmm.selectorLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
