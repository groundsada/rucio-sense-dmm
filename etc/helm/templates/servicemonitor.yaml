{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dmm.fullname" . }}
  labels:
    {{- include "dmm.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dmm.selectorLabels" . | nindent 6 }}
  endpoints:
  # By name, and with a leading slash on the path. Whatever scrape config
  # existed before this chart targeted port 433 with path "metrics" and can
  # never have worked.
  - port: metrics
    path: /metrics
    interval: {{ .Values.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
