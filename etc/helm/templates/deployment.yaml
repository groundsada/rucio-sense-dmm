apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dmm.fullname" . }}
  labels:
    {{- include "dmm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.postgres.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "dmm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dmm.selectorLabels" . | nindent 8 }}
      {{- if .Values.metricsAnnotations.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.dmm.metricsPort | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      containers:
      - name: postgres
        image: {{ .Values.postgres.image }}
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
        env:
        {{- if .Values.postgres.existingSecret }}
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret }}
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret }}
              key: POSTGRES_PASSWORD
        {{- else }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.env.user | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.env.password | quote }}
        {{- end }}
        {{- if .Values.postgres.persistence.enabled }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        {{- end }}
      - name: dmm
        image: "{{ .Values.dmm.image.repository }}:{{ .Values.dmm.image.tag }}"
        imagePullPolicy: {{ .Values.dmm.image.pullPolicy }}
        resources:
          {{- toYaml .Values.dmm.resources | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.dmm.port }}
        - name: metrics
          containerPort: {{ .Values.dmm.metricsPort }}
        env:
        - name: DMM_HEARTBEAT_DIR
          value: {{ .Values.dmm.heartbeatDir | quote }}
        {{- if .Values.otel.endpoint }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.otel.serviceName | quote }}
        - name: OTEL_TRACES_SAMPLER_ARG
          value: {{ .Values.otel.samplerArg | quote }}
        {{- with .Values.otel.resourceAttributes }}
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.otel.headers }}
        - name: OTEL_EXPORTER_OTLP_HEADERS
          value: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.probes.readiness.enabled }}
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        {{- end }}
        {{- if .Values.probes.liveness.enabled }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        {{- end }}
        volumeMounts:
        - name: heartbeats
          mountPath: {{ .Values.dmm.heartbeatDir }}
        - name: dmm-config
          mountPath: {{ .Values.paths.dmmConfig }}
          subPath: dmm.cfg
        - name: sense-config
          mountPath: {{ .Values.paths.senseConfig }}
          subPath: .sense-o-auth.yaml
        - name: rucio-client-config
          mountPath: {{ .Values.paths.rucioConfig }}
          subPath: rucio.cfg
        - name: ca-volume
          mountPath: {{ .Values.paths.caBundle }}
        - name: certs
          mountPath: {{ .Values.certs.mountDir }}/key.pem
          subPath: {{ .Values.certs.keyFile }}
        - name: certs
          mountPath: {{ .Values.certs.mountDir }}/cert.pem
          subPath: {{ .Values.certs.certFile }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: heartbeats
        emptyDir: {}
      {{- if .Values.postgres.persistence.enabled }}
      - name: postgres-data
        persistentVolumeClaim:
          claimName: {{ .Values.postgres.persistence.existingClaim | default (printf "%s-postgres" (include "dmm.fullname" .)) }}
      {{- end }}
      - name: dmm-config
        secret:
          secretName: {{ .Values.secrets.dmmConfig }}
      - name: rucio-client-config
        secret:
          secretName: {{ .Values.secrets.rucioClientConfig }}
      - name: sense-config
        secret:
          secretName: {{ .Values.secrets.senseConfig }}
      - name: certs
        secret:
          secretName: {{ .Values.secrets.certs }}
          items:
            - key: {{ .Values.certs.certFile }}
              path: {{ .Values.certs.certFile }}
            - key: {{ .Values.certs.keyFile }}
              path: {{ .Values.certs.keyFile }}
      - name: ca-volume
        secret:
          defaultMode: 420
          secretName: {{ .Values.secrets.caBundle }}
